<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameVault | Loja de Jogos</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🎮 GameVault</h1><input id="q" placeholder="Buscar jogo..."><span id="user"></span><button id="cartBtn">🛒 Carrinho (<span id="count">0</span>)</button></header>
<div id="hero"></div><nav id="tabs"></nav>
<main><section id="recentSec" hidden><h2>👀 Vistos recentemente</h2><div id="recent" class="grid"></div></section>
<h2>Catálogo</h2><div id="grid" class="grid"></div></main><dialog id="dlg"></dialog>
<aside id="cart" hidden><h2>Seu carrinho</h2><div id="items"></div><h3 style="margin-top:14px">Total: <span id="total"></span></h3>
<button class="green" id="buy">Enviar pedido via WhatsApp</button><button class="sec" id="close" style="width:100%;margin-top:8px">Fechar</button></aside>
<script src="app.js"></script></body></html>
