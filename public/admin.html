<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameVault | Painel Admin</title><link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script></head><body>
<div class="app"><aside class="side"><h2>🔐 Admin</h2>
<button data-v="dash" class="on">📊 Dashboard</button><button data-v="form">➕ Cadastrar jogo</button><button data-v="prod">🎮 Produtos</button><button data-v="ped">🧾 Pedidos</button>
<a href="/loja.html">🛒 Ver loja</a><button class="sec" id="out">Sair</button></aside>
<div class="content">
<section class="view" id="v-dash"><h2>Dashboard</h2><div class="stats" id="stats"></div>
<div class="two"><div class="chart"><h3>Vendas – últimos 7 dias</h3><canvas id="c1"></canvas></div><div class="chart"><h3>Vendas por plataforma</h3><canvas id="c2"></canvas></div></div>
<div class="chart" style="margin-top:16px"><h3>Jogos mais vendidos</h3><div id="top"></div></div></section>
<section class="view" id="v-form" hidden><h2 id="ft">Cadastrar jogo</h2><div class="chart frm">
<div><label>Nome</label><input id="nome"></div><div><label>Plataforma</label><select id="plataforma"><option>PlayStation</option><option>Xbox</option><option>PC</option></select></div>
<div><label>Ano de lançamento</label><input id="ano" type="number" min="1970" max="2100"></div><div><label>Desenvolvedora</label><input id="desenvolvedora"></div>
<div><label>Gênero</label><input id="genero"></div><div><label>Classificação</label><select id="classificacao"><option>Livre</option><option>10+</option><option>12+</option><option>14+</option><option>16+</option><option>18+</option></select></div>
<div><label>Preço (R$)</label><input id="preco" type="number" step="0.01" min="0"></div><div><label>Estoque</label><input id="estoque" type="number" min="0"></div>
<div class="full"><label>Imagem do jogo (enviar arquivo)</label><input id="arq" type="file" accept="image/*"><img id="prev" hidden></div>
<div class="full"><label>…ou URL da imagem</label><input id="imagem"></div><div class="full"><label>Descrição</label><textarea id="descricao" rows="3"></textarea></div>
<div class="full"><button id="save">Cadastrar produto</button> <button class="sec" id="cancel" hidden>Cancelar edição</button><p class="err" id="msg"></p></div></div></section>
<section class="view" id="v-prod" hidden><h2>Produtos</h2><div id="list"></div></section>
<section class="view" id="v-ped" hidden><h2>Pedidos</h2><div class="chart"><table id="orders"></table></div></section>
</div></div><script src="admin.js"></script></body></html>
